[project]
name = "yoto-bulk"
version = "0.1.0"
description = "Shared domain helpers for the Yoto/BorrowBox web services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "borrowbox",
  "httpx>=0.28.1",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.8.1",
  "tenacity>=9.1.2",
  "openai>=1.72.0",
  "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.4",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
borrowbox = { workspace = true }
yoto-bulk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
  "e2e: opt-in end-to-end tests against running services and real credentials",
]
